<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NoBeerNoLife/20251018test 掲示板ログ</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0b1224;
        --bg-soft: #111b32;
        --card: #0f172a;
        --text: #e8edf7;
        --muted: #a9b8d7;
        --accent: #4ade80;
        --accent-strong: #22c55e;
        --shadow: 0 18px 42px rgba(0, 0, 0, 0.35);
        --radius: 18px;
        font-family: "Space Grotesk", "Segoe UI", -apple-system, BlinkMacSystemFont,
          "Helvetica Neue", sans-serif;
      }

      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f6f8fe;
          --bg-soft: #e8ecf8;
          --card: #ffffff;
          --text: #0f172a;
          --muted: #4b5563;
          --accent: #0ea5e9;
          --accent-strong: #0284c7;
          --shadow: 0 16px 32px rgba(15, 23, 42, 0.12);
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(circle at 20% 20%, rgba(74, 222, 128, 0.08), transparent 40%),
          radial-gradient(circle at 80% 0%, rgba(14, 165, 233, 0.12), transparent 38%),
          var(--bg);
        color: var(--text);
        display: flex;
        flex-direction: column;
      }

      header {
        padding: 2.4rem 1.4rem 1.2rem;
        max-width: 960px;
        width: min(960px, 100%);
        margin: 0 auto;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.9rem, 5vw, 2.5rem);
        letter-spacing: 0.01em;
      }

      header p {
        margin: 0.8rem 0 1.6rem;
        color: var(--muted);
        line-height: 1.6;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.45rem;
        padding: 0.8rem 1.2rem;
        border-radius: 999px;
        text-decoration: none;
        font-weight: 700;
        letter-spacing: 0.01em;
        border: 1px solid transparent;
        transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      }

      .button.primary {
        background: linear-gradient(135deg, var(--accent), var(--accent-strong));
        color: #0b1020;
        box-shadow: var(--shadow);
      }

      .button.secondary {
        background: rgba(255, 255, 255, 0.05);
        border-color: rgba(148, 163, 184, 0.35);
        color: var(--text);
      }

      .button:hover,
      .button:focus-visible {
        transform: translateY(-2px);
        box-shadow: var(--shadow);
      }

      main {
        flex: 1;
        padding: 1.4rem;
        max-width: 960px;
        width: min(960px, 100%);
        margin: 0 auto 1.5rem;
      }

      .status {
        margin: 0 0 1.1rem;
        padding: 1rem 1.2rem;
        background: rgba(148, 163, 184, 0.12);
        border-radius: var(--radius);
        color: var(--muted);
        font-size: 0.95rem;
      }

      .status.error {
        background: rgba(248, 113, 113, 0.18);
        color: #fca5a5;
      }

      .issues-list {
        display: grid;
        gap: 1rem;
      }

      .issue-card {
        background: var(--card);
        border-radius: var(--radius);
        padding: 1.25rem 1.3rem;
        box-shadow: var(--shadow);
        border: 1px solid rgba(148, 163, 184, 0.25);
        display: grid;
        gap: 0.65rem;
      }

      .issue-header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.65rem;
      }

      .issue-title {
        font-size: clamp(1.05rem, 3vw, 1.2rem);
        font-weight: 700;
        margin: 0;
      }

      .issue-title a {
        color: inherit;
        text-decoration: none;
      }

      .issue-title a:hover,
      .issue-title a:focus-visible {
        text-decoration: underline;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 0.3rem;
        padding: 0.38rem 0.72rem;
        border-radius: 999px;
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-weight: 800;
        background: rgba(74, 222, 128, 0.14);
        color: #4ade80;
      }

      .pill.closed {
        background: rgba(248, 113, 113, 0.14);
        color: #fca5a5;
      }

      .issue-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 0.7rem;
        font-size: 0.86rem;
        color: var(--muted);
      }

      .labels {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
      }

      .label-chip {
        padding: 0.24rem 0.55rem;
        border-radius: 12px;
        font-size: 0.76rem;
        font-weight: 700;
        background: rgba(148, 163, 184, 0.28);
        color: var(--text);
      }

      footer {
        padding: 1.2rem;
        font-size: 0.85rem;
        color: var(--muted);
        text-align: center;
      }

      @media (max-width: 640px) {
        header,
        main {
          padding: 1.1rem;
        }

        .issue-card {
          padding: 1.05rem 1.1rem;
        }

        .actions {
          flex-direction: column;
        }

        .button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>NoBeerNoLife/20251018test 掲示板ログ</h1>
      <p>
        GitHub Issues を掲示板として表示しています。投稿・返信は GitHub の Issue
        画面から行ってください。Google Sites などの iframe 埋め込みにも対応するよう軽量に仕上げています。
      </p>
      <div class="actions">
        <a
          class="button primary"
          href="https://github.com/NoBeerNoLife/20251018test/issues/new"
          target="_blank"
          rel="noopener"
        >
          新規投稿 (Issue を開く)
        </a>
        <a
          class="button secondary"
          href="https://github.com/NoBeerNoLife/20251018test/issues"
          target="_blank"
          rel="noopener"
        >
          GitHub で全件を見る
        </a>
        <a class="button secondary" href="#" id="reload-button">再読み込み</a>
      </div>
    </header>
    <main>
      <div id="status" class="status" role="status">読み込み中です…</div>
      <section
        id="issues"
        class="issues-list"
        aria-live="polite"
        aria-busy="true"
      ></section>
    </main>
    <footer>
      GitHub API から Issue を取得します。レート制限時は数分後にリロードしてください。
    </footer>
    <script>
      const OWNER = "NoBeerNoLife";
      const REPO = "20251018test";
      const API_URL = `https://api.github.com/repos/${OWNER}/${REPO}/issues?state=all&per_page=50`;

      const statusEl = document.getElementById("status");
      const issuesEl = document.getElementById("issues");
      const reloadButton = document.getElementById("reload-button");

      async function fetchIssues() {
        const response = await fetch(API_URL, {
          headers: { Accept: "application/vnd.github+json" },
        });

        if (!response.ok) {
          throw new Error(`GitHub API error (${response.status} ${response.statusText})`);
        }

        const rawIssues = await response.json();
        return rawIssues.filter((issue) => !issue.pull_request);
      }

      function formatDate(value) {
        return new Date(value).toLocaleString("ja-JP", {
          year: "numeric",
          month: "short",
          day: "numeric",
          hour: "2-digit",
          minute: "2-digit",
          timeZone: "Asia/Tokyo",
        });
      }

      function timeAgo(value) {
        const diff = Date.now() - new Date(value).getTime();
        const rtf = new Intl.RelativeTimeFormat("ja", { numeric: "auto" });
        const ranges = {
          year: 1000 * 60 * 60 * 24 * 365,
          month: (1000 * 60 * 60 * 24 * 365) / 12,
          week: 1000 * 60 * 60 * 24 * 7,
          day: 1000 * 60 * 60 * 24,
          hour: 1000 * 60 * 60,
          minute: 1000 * 60,
          second: 1000,
        };

        for (const [unit, ms] of Object.entries(ranges)) {
          if (Math.abs(diff) > ms || unit === "second") {
            return rtf.format(Math.round(diff / ms) * -1, unit);
          }
        }
        return "";
      }

      function createIssueCard(issue) {
        const card = document.createElement("article");
        card.className = "issue-card";
        card.setAttribute("tabindex", "0");
        card.setAttribute("aria-label", `Issue ${issue.number}: ${issue.title}`);

        const header = document.createElement("header");
        header.className = "issue-header";

        const title = document.createElement("h2");
        title.className = "issue-title";
        const titleLink = document.createElement("a");
        titleLink.href = issue.html_url;
        titleLink.target = "_blank";
        titleLink.rel = "noopener";
        titleLink.textContent = `#${issue.number} ${issue.title}`;
        title.appendChild(titleLink);

        const statePill = document.createElement("span");
        statePill.className = `pill ${issue.state}`;
        statePill.textContent = issue.state === "open" ? "OPEN" : "CLOSED";

        header.appendChild(title);
        header.appendChild(statePill);

        const meta = document.createElement("div");
        meta.className = "issue-meta";
        meta.innerHTML = `
          <span>作成: @${issue.user.login}</span>
          <span>更新: ${timeAgo(issue.updated_at)} (${formatDate(issue.updated_at)})</span>
          <span>コメント: ${issue.comments}</span>
        `;

        const labels = document.createElement("div");
        labels.className = "labels";

        if (issue.labels && issue.labels.length > 0) {
          issue.labels.forEach((label) => {
            const chip = document.createElement("span");
            chip.className = "label-chip";
            chip.textContent = label.name;
            if (label.color) {
              chip.style.backgroundColor = `#${label.color}30`;
              chip.style.color = `#${label.color}`;
            }
            labels.appendChild(chip);
          });
        }

        const bodyPreview = document.createElement("p");
        bodyPreview.textContent = issue.body
          ? issue.body.slice(0, 200).replace(/\s+/g, " ").trim() +
            (issue.body.length > 200 ? "…" : "")
          : "本文なし";

        card.appendChild(header);
        card.appendChild(meta);
        if (labels.childElementCount) {
          card.appendChild(labels);
        }
        card.appendChild(bodyPreview);

        return card;
      }

      async function init() {
        try {
          statusEl.setAttribute("aria-busy", "true");
          statusEl.textContent = "GitHub Issues を取得しています…";
          issuesEl.setAttribute("aria-busy", "true");

          const issues = await fetchIssues();

          statusEl.setAttribute("aria-busy", "false");
          issuesEl.setAttribute("aria-busy", "false");

          if (issues.length === 0) {
            statusEl.textContent =
              "表示できる Issue はありません。右上のボタンから最初の投稿を作成してください。";
            return;
          }

          statusEl.textContent = `最新の投稿 ${issues.length} 件を表示中です。`;
          issues.forEach((issue) => issuesEl.appendChild(createIssueCard(issue)));
        } catch (error) {
          statusEl.setAttribute("aria-busy", "false");
          issuesEl.setAttribute("aria-busy", "false");
          statusEl.textContent =
            "Issue の取得に失敗しました。時間をおいて再読み込みしてください。";
          statusEl.classList.add("error");
          if (error?.message?.includes("API rate limit exceeded")) {
            statusEl.textContent =
              "GitHub API のレート制限に達しました。数分後に再読み込みしてください。";
          }
          console.error(error);
        }
      }

      document.addEventListener("DOMContentLoaded", init);
      reloadButton?.addEventListener("click", (event) => {
        event.preventDefault();
        issuesEl.innerHTML = "";
        statusEl.classList.remove("error");
        init();
      });
    </script>
  </body>
</html>
